<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ching Kai Yuan | Projects & Resume</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background-color: #f0f2f5;
      color: #333;
    }
    header {
      background-color: #007bff;
      color: white;
      padding: 20px;
      text-align: center;
    }
    h1, h2 {
      margin: 0;
    }
    main {
      padding: 30px;
      max-width: 900px;
      margin: auto;
    }
    .section {
      margin-bottom: 40px;
    }
    .button-container {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 20px;
    }
    a.button {
      display: inline-block;
      padding: 12px 18px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }
    a.button:hover {
      background-color: #0056b3;
    }
    iframe {
      width: 100%;
      height: 800px;
      border: 1px solid #ccc;
      margin-top: 20px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Ching Kai Yuan</h1>
    <p>My GitHub Projects & Resume</p>
  </header>

  <main>
    <!-- Resume Section -->
    <div class="section">
      <h2>📄 Resume</h2>
      <div class="button-container">
        <a href="ching-kai-yuan-resume.pdf" target="_blank" class="button">🔍 View Resume</a>
        <a href="ching-kai-yuan-resume.pdf" download class="button">⬇️ Download Resume</a>
      </div>
      <iframe src="ching-kai-yuan-resume.pdf"></iframe>
    </div>

    <!-- GitHub Repositories -->
    <div class="section">
      <h2>📦 GitHub Repositories</h2>
      <div class="button-container" id="repo-buttons">Loading repositories...</div>
    </div>
  </main>

  <script>
    fetch('https://api.github.com/users/bgboss69/repos')
      .then(response => response.json())
      .then(repos => {
        const container = document.getElementById('repo-buttons');
        container.innerHTML = ''; // Clear "Loading..." text
        repos.forEach(repo => {
          const link = document.createElement('a');
          link.href = repo.html_url;
          link.target = "_blank";
          link.className = "button";
          link.textContent = repo.name;
          container.appendChild(link);
        });
      })
      .catch(error => {
        console.error('Error fetching GitHub repos:', error);
        document.getElementById('repo-buttons').textContent = 'Failed to load repositories.';
      });
  </script>

</body>
</html>
