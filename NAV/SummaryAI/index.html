<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>My Book Summaries</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f9;
            margin: 0;
            padding: 0;
        }

        header {
            background: #5c6bc0;
            color: white;
            padding: 1em;
            text-align: center;
        }

        main {
            max-width: 900px;
            margin: 2em auto;
            padding: 1em;
        }

        .book-list {
            list-style: none;
            padding: 0;
        }

        .book-item {
            background: white;
            margin-bottom: 1em;
            padding: 1em;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
        }

        .book-item span {
            flex: 1 1 200px;
        }

        button,
        a button {
            background: #5c6bc0;
            color: white;
            border: none;
            padding: 0.5em 1em;
            border-radius: 4px;
            cursor: pointer;
            margin: 0.2em;
        }

        button:hover,
        a button:hover {
            background: #3949ab;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background: #fefefe;
            margin: 10% auto;
            padding: 20px;
            border-radius: 8px;
            width: 80%;
            max-width: 700px;
            white-space: pre-wrap;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            cursor: pointer;
        }

        .close:hover {
            color: black;
        }

        nav {
            text-align: center;
            margin-bottom: 2em;
        }

        nav a {
            text-decoration: none;
            color: #5c6bc0;
            margin: 0 1em;
            font-weight: bold;
        }

        nav a:hover {
            color: #3949ab;
        }
    </style>
</head>

<body>

    <header>
        <h1>📚 My Book Summaries</h1>
    </header>
    <nav>
        <a href="#">Home</a>
        <a href="#">All Books</a>
        <a href="#">About</a>
    </nav>

    <main>
        <ul class="book-list" id="bookList"></ul>
    </main>

    <!-- Summary Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" id="modalClose">&times;</span>
            <div id="modalText"></div>
        </div>
    </div>

    <script>
        fetch("books.json")
            .then(res => res.json())
            .then(books => {
                const bookList = document.getElementById("bookList");

                books.forEach(book => {
                    const li = document.createElement("li");
                    li.className = "book-item";

                    // Title
                    const titleSpan = document.createElement("span");
                    titleSpan.textContent = book.title;
                    li.appendChild(titleSpan);

                    // Download EPUB
                    if (book.epubPath) {
                        const downloadBtn = document.createElement("a");
                        downloadBtn.href = book.epubPath;
                        downloadBtn.download = "";
                        downloadBtn.innerHTML = '<button>Download EPUB</button>';
                        li.appendChild(downloadBtn);

                        // View EPUB
                        const viewBtn = document.createElement("button");
                        viewBtn.textContent = "View EPUB";
                        viewBtn.onclick = () => {
                            window.open(`viewer.html?file=${encodeURIComponent(book.epubPath)}`, "_blank");
                        };
                        li.appendChild(viewBtn);
                    }

                    // View Summary
                    if (book.summaryPath) {
                        fetch(book.summaryPath)
                            .then(res => res.text())
                            .then(text => {
                                const summaryBtn = document.createElement("button");
                                summaryBtn.textContent = "View Summary";
                                summaryBtn.onclick = () => {
                                    document.getElementById("modalText").textContent = text;
                                    document.getElementById("modal").style.display = "block";
                                };
                                li.appendChild(summaryBtn);
                            });
                    }

                    bookList.appendChild(li);
                });
            });

        // Close modal
        document.getElementById("modalClose").onclick = () => {
            document.getElementById("modal").style.display = "none";
        }
        window.onclick = (event) => {
            if (event.target === document.getElementById("modal")) {
                document.getElementById("modal").style.display = "none";
            }
        }
    </script>

</body>

</html>
